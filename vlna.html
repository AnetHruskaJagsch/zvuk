<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vlna</title>
  <style>
    :root {
      --bg: #f5f3ee;
      --fg: #111111;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0e0e; --fg: #f2f0ea; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg); }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="vlna" aria-label="zvuková vlna" role="img"></canvas>
  <script>
    const canvas = document.getElementById('vlna');
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w, h, dpr;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // Several overlapping waves, faded toward the edges like a real waveform.
    const layers = [
      { freq: 3.0, speed: 1.6, amp: 1.00, alpha: 1.00, width: 2.0 },
      { freq: 4.7, speed: -1.1, amp: 0.70, alpha: 0.45, width: 1.5 },
      { freq: 2.1, speed: 0.8, amp: 0.85, alpha: 0.30, width: 1.2 },
      { freq: 6.3, speed: 2.3, amp: 0.45, alpha: 0.20, width: 1.0 },
    ];

    function draw(t) {
      const fg = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
      ctx.clearRect(0, 0, w, h);
      const mid = h / 2;
      const maxAmp = Math.min(h * 0.28, 220);
      const time = t / 1000;
      const pulse = 0.75 + 0.25 * Math.sin(time * 0.9);

      ctx.strokeStyle = fg;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (const l of layers) {
        ctx.globalAlpha = l.alpha;
        ctx.lineWidth = l.width;
        ctx.beginPath();
        for (let x = 0; x <= w; x += 2) {
          const p = x / w;                       // 0..1 across the screen
          const envelope = Math.pow(Math.sin(Math.PI * p), 2);
          const y = mid + Math.sin(p * Math.PI * 2 * l.freq + time * l.speed)
                        * Math.sin(p * Math.PI * 2 * (l.freq * 0.37) - time * 0.5)
                        * maxAmp * l.amp * envelope * pulse;
          x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      if (!reduceMotion) requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); if (reduceMotion) draw(0); });
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
