<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vlna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    /* Black with fine forest-green dots, like the rest of the portfolio. */
    :root {
      --bg: #000000;
      --green: #1f3d2b;
      --glow: rgba(31, 61, 43, 0.7);
      --dot: rgba(31, 61, 43, 0.55);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1.6px);
      background-size: 14px 14px;
      color: var(--green);
      font-family: "IBM Plex Mono", "JetBrains Mono", "Space Mono", ui-monospace, Menlo, monospace;
    }
    canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
    /* Title sits just above the top of the waveform. */
    h1 {
      position: fixed;
      left: 50%;
      bottom: calc(50vh + min(32vh, 260px) + 1.2em);
      transform: translateX(-50%);
      width: max-content;
      max-width: 90vw;
      font-size: clamp(1.1rem, 2.4vw, 1.9rem);
      font-style: italic;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-align: center;
      text-shadow: 0 0 10px var(--glow);
      pointer-events: none;
    }
    button {
      position: fixed;
      left: 50%;
      bottom: 9vh;
      transform: translateX(-50%);
      background: none;
      border: 0;
      padding: 0.6em 1em;
      color: var(--green);
      font: 500 15px/1 "IBM Plex Mono", "JetBrains Mono", "Space Mono", ui-monospace, Menlo, monospace;
      letter-spacing: 0.14em;
      text-shadow: 0 0 8px var(--glow);
      cursor: pointer;
      transition: filter 0.3s ease;
    }
    button:hover, button:focus-visible { filter: brightness(1.5); }
    button:focus-visible { outline: 1px solid currentColor; }
    button.playing { opacity: 0.6; }
    button[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>jak se oceán sbírá</h1>
  <canvas id="vlna" aria-label="zvuková vlna: jak se oceán sbírá" role="img"></canvas>
  <audio id="zvuk" src="vlny.m4a" preload="auto" loop></audio>
  <button id="hraj" type="button">▶︎ přehrát</button>
  <script>

    // Each character is one value from 0 to 63 (peak and RMS loudness).

    const RMS = '0000000000000000000000000412032233364455424574465466686533410222222103202222103333423123041540423333331444445637877576467546687779589A9A988A88CA978A7988A98779998A89AB99CB9CDBCCACCBDBDABBFC9AABCA99997998A96786A8987888877775868787647767A98898D9A87788866456785565574689997877B99AAB9B9789A887989978BA8A78A9C9C8B88DCDEEICCCADBA9A889A9888BABBADBDFFGEDBDCABBA8A978889B8B8B89999ADECDCFEFIKJHHHHJNMNKNPUQPTTTTXTRTWSSURRUTVRTSWXdYVaVVWZXVXXdVVVWWYTTOTQQQSOOPQOMNLORPPPPPQORRQPNPMNNQRRSTTQTTSTSQYUZXZXZhkehmopuvvy-_____________wstmpjeccabaWWXYWWUWYTQRVTOQSRNPNOMONOLMORQLMKILKIGGGEEGEFEEGCEFGCDEGEFGDDEBBBCDEEHFILNEFMONPRSKJKFLKFHKMLHHIEEBDBA9AAAECCD9CB9AABACCAA99BABBFBCB9AABCBCCDCCCFEDEEGGDEEEEFHEIHGHEGFHGHEHFFHEDCGFIKIHGFGEFEGFHEGGGHHGFHHFDCECDFDFEDGEBEEEECEDCDEEFCEDGCABDDBBCA9BCBADAFFGGEEEFFDFEEFGFFFFEEEGGHFFCDCFEEDEBCADCGJHDEFFFEDGEECDCGCCACACKGKFDCBCDACGBEEECCCAB9AAA9DBBA8A98978997578999876797888687868997H9999697889C78AC9CB8AA9A98A888CA99BAABDDHCA8BBA9ADACAFDCCDGHEEEACBCA9AB9ABAD9BCCACEBABCCCDCECCCBBACB9B9AAACABAABHFEGGLPJKIMLONMONUbfWVmrTOPPMMMGKQVTOSSQTUPHGFECBBAA89A889A7999A9787579998C79869878AAA7A99DCDCDFEFFFHHGHFFECGHIPMMPRQQRRSRRRUSQSQQPSURPSUSRRPNNNMMJMOMJGGDGFDCCD9D9A9CB9A897A778ACDA9AAB9A99888A99876667A79869A99988687ABCCCDEFFDEHJIHIHIJNMKKJLNNJJMMNOPTSQLKNIKKPIIKIIHIEEEFEFFEEDDDDBDCCEBCB9999BBAAABBCBBCBBA9BAAA998785797CGBDBEECCCAHEDDCCDFDEDCCDFDEEEFDDCGGGGHIFHGFHEFEDBEEFEHFFHHFHKKKKNKHJKIILGJIHKLKKJKJJONJKKNLLMMRRUSQSUWSWbfachokspkpjrv__vstvouwsqsr-____vojmjiffjjffhecbaYXaWRRSPLLKJJIHIKJGHGFEECDFCDBCCBCDECGGGFDEKJIGKLNJMLJIHHHLJJILJLJMJKIHFGINOTORTUTTUVQLPNOOOSOQQQPQOPQOQPMNLPPPNKMJLJJJMKLJIKLOMLLMMNPPQSSQSRUQSTQSTTUTUSSVSTWdaYebabXXWZYcpzskoyy_____yqkohjZYTPQPNNMNKJJJFFDGEEHFCFCDCDEDFFFDGGDDCA9A9AABCBAABAACDGEJKNPPNQLJLPJMIEECFDDEEEEHFBDDEFHECBCDEFILjjkfhjjfaXYVRPSRSSRSKKHFCBADBEFHHKIGFECBB9B9C99998CBDBFCFHNLLQOMPLOMJIGFDCBA87674344676567244244355755434989CBAACD9ACEHGEFHLKKIMIJKIKLMPOKJHECB9BBBCDCFEDFFEDHJHJHHKPPSQPSOROMKLKDCB99A9ACAA8899A989BABABBCBAA989A9ADFFGEEDBAAC9CEDDHHKKGJGEBBB9DDCFMQMNJHDEGFDAAA7878798A79AAHDDEHDDGBDBAA799D67A99B7879A898C989A98A889ADBCDBFGDCGGHEFEDBECFGDCFEEGFCCDDBDCDBDAE9ADA99777958A97699BBAC9A868877997BAADFDDDBCBAABACC98A7787676968AA68868776588888698874546677A6A87899ADBA8AA9ABACAB889AA9A9AGEFCBCKD9BFCDIFAFIBE8ABA77888767765655755666576677794568A7975A69DIEECFPOMIJFGBJBAPB84749742000000000000000000';
    const DURATION = 118;
    const ABC = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_';
    const decode = s => Array.from(s, c => ABC.indexOf(c) / 63);
    const peak = decode(PEAK);
    const rms = decode(RMS);
    const N = peak.length;

    const GREEN = '#1f3d2b', PLAYED = '#2e5b40', GLOW = 'rgba(31, 61, 43, 0.9)';
    const canvas = document.getElementById('vlna');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('zvuk');
    const btn = document.getElementById('hraj');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const REVEAL = 2200;
    const FADE = 800;
    let w, h, cols, start = null, started = false, fadeFrom = null;

    const dur = () => (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : DURATION;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Group the recording into columns that fit the screen.
      const pad = Math.max(16, w * 0.06);
      const step = w < 600 ? 2 : 3;
      const n = Math.floor((w - 2 * pad) / step);
      cols = [];
      for (let j = 0; j < n; j++) {
        const a = Math.floor(j * N / n), b = Math.max(a + 1, Math.floor((j + 1) * N / n));
        let pk = 0, r = 0;
        for (let k = a; k < b; k++) { pk = Math.max(pk, peak[k]); r += rms[k]; }
        cols.push({ x: pad + j * step + step / 2, pk, r: r / (b - a) });
      }
    }

    function draw(t) {
      if (start === null) start = t;
      const el = reduceMotion ? Infinity : t - start;
      ctx.clearRect(0, 0, w, h);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Gentle fade-in of the volume after playback starts.
      if (fadeFrom !== null) {
        const v = Math.min(1, (performance.now() - fadeFrom) / FADE);
        try { audio.volume = v; } catch (e) {}
        if (v >= 1) fadeFrom = null;
      }

      const mid = h / 2;
      const maxAmp = Math.min(h * 0.32, 260);
      const n = cols.length;
      const x0 = cols[0].x, x1 = cols[n - 1].x;
      const reveal = Math.min(1, el / REVEAL);
      // The playhead follows the sound.
      const playX = started ? x0 + (audio.currentTime / dur()) * (x1 - x0) : -1e9;
      const swell = reduceMotion ? 0 : (audio.paused ? 0.06 : 0.18);

      const amp = c => {
        const grow = Math.min(1, Math.max(0, reveal * 1.3 - (c.x - x0) / (x1 - x0) * 0.3));
        const ease = 1 - Math.pow(1 - grow, 3);
        const ripple = 1 + swell * Math.exp(-Math.pow((c.x - playX) / 45, 2));
        return ease * ripple;
      };

      // Body of the waveform: thin vertical lines (peak loudness); the played part is a lighter green.
      ctx.lineWidth = 1;
      ctx.shadowBlur = 0;
      for (const c of cols) {
        const a = amp(c);
        const y = Math.max(0.5, c.pk * maxAmp * a);
        const played = c.x <= playX;
        ctx.strokeStyle = played ? PLAYED : GREEN;
        ctx.globalAlpha = played ? 0.9 : 0.6;
        ctx.beginPath();
        ctx.moveTo(c.x, mid - y);
        ctx.lineTo(c.x, mid + y);
        ctx.stroke();
      }

      // Outline: smooth contour of the RMS loudness, mirrored, with a soft glow.
      ctx.globalAlpha = 1;
      ctx.strokeStyle = GREEN;
      ctx.shadowColor = GLOW;
      ctx.shadowBlur = 10;
      ctx.lineWidth = 1.6;
      for (const dir of [-1, 1]) {
        ctx.beginPath();
        cols.forEach((c, j) => {
          const y = mid + dir * c.r * maxAmp * 0.85 * amp(c);
          if (j === 0) ctx.moveTo(c.x, y);
          else {
            const p = cols[j - 1];
            const py = mid + dir * p.r * maxAmp * 0.85 * amp(p);
            ctx.quadraticCurveTo(p.x, py, (p.x + c.x) / 2, (py + y) / 2);
          }
        });
        ctx.stroke();
      }
      ctx.shadowBlur = 0;

      if (!reduceMotion) requestAnimationFrame(draw);
    }

    function play() {
      fadeFrom = performance.now();
      try { audio.volume = 0; } catch (e) {}
      return audio.play();
    }

    function toggle() {
      if (audio.paused) play().catch(() => {});
      else audio.pause();
    }

    // Click on the wave: play from that point.
    canvas.addEventListener('click', e => {
      const x0 = cols[0].x, x1 = cols[cols.length - 1].x;
      const f = (e.clientX - x0) / (x1 - x0);
      if (f >= 0 && f <= 1) audio.currentTime = f * dur();
      if (audio.paused) play().catch(() => {});
    });
    btn.addEventListener('click', toggle);
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); toggle(); }
    });

    audio.addEventListener('play', () => {
      started = true;
      btn.textContent = 'pauza';
      btn.classList.add('playing');
    });
    audio.addEventListener('pause', () => {
      btn.textContent = '▶︎ přehrát';
      btn.classList.remove('playing');
    });
    audio.addEventListener('error', () => { btn.hidden = true; });
    if (reduceMotion) {
      for (const ev of ['timeupdate', 'seeked', 'play', 'pause']) audio.addEventListener(ev, () => draw(0));
    }

    window.addEventListener('resize', () => { resize(); if (reduceMotion) draw(0); });
    resize();
    requestAnimationFrame(draw);
    // Start the sound right away if the browser allows it; otherwise the button waits for a click.
    play().catch(() => {});
  </script>
</body>
