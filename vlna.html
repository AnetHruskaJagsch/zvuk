    const DURATION = 137;
    const ABC = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_';
    const decode = s => Array.from(s, c => ABC.indexOf(c) / 63);
    const peak = decode(PEAK);
    const rms = decode(RMS);
    const N = peak.length;

    const canvas = document.getElementById('vlna');
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const REVEAL = 2200;
    let w, h, cols, start = null;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Group the recording into columns that fit the screen.
      const pad = Math.max(16, w * 0.06);
      const step = w < 600 ? 2 : 3;
      const n = Math.floor((w - 2 * pad) / step);
      cols = [];
      for (let j = 0; j < n; j++) {
        const a = Math.floor(j * N / n), b = Math.max(a + 1, Math.floor((j + 1) * N / n));
        let pk = 0, r = 0;
        for (let k = a; k < b; k++) { pk = Math.max(pk, peak[k]); r += rms[k]; }
        cols.push({ x: pad + j * step + step / 2, pk, r: r / (b - a) });
      }
    }

    function draw(t) {
      if (start === null) start = t;
      const fg = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
      const el = reduceMotion ? Infinity : t - start;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = fg;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const mid = h / 2;
      const maxAmp = Math.min(h * 0.32, 260);
      const n = cols.length;
      const reveal = Math.min(1, el / REVEAL);
      // Playhead moves through the recording in real time, then loops.
      const play = reduceMotion ? -1 : (((el - REVEAL) / 1000) / DURATION) % 1;
      const playX = play < 0 ? -1e9 : cols[0].x + play * (cols[n - 1].x - cols[0].x);

      const amp = c => {
        const grow = Math.min(1, Math.max(0, reveal * 1.3 - (c.x - cols[0].x) / (cols[n - 1].x - cols[0].x) * 0.3) );
        const ease = 1 - Math.pow(1 - grow, 3);
        const ripple = 1 + 0.18 * Math.exp(-Math.pow((c.x - playX) / 45, 2));
        return ease * ripple;
      };

      // Body of the waveform: thin vertical lines (peak loudness).
      ctx.lineWidth = 1;
      for (const c of cols) {
        const a = amp(c);
        const y = Math.max(0.5, c.pk * maxAmp * a);
        ctx.globalAlpha = c.x <= playX ? 0.42 : 0.2;
        ctx.beginPath();
        ctx.moveTo(c.x, mid - y);
        ctx.lineTo(c.x, mid + y);
        ctx.stroke();
      }

      // Outline: smooth contour of the RMS loudness, mirrored.
      ctx.globalAlpha = 1;
      ctx.lineWidth = 1.6;
      for (const dir of [-1, 1]) {
        ctx.beginPath();
        cols.forEach((c, j) => {
          const y = mid + dir * c.r * maxAmp * 0.85 * amp(c);
          if (j === 0) ctx.moveTo(c.x, y);
          else {
            const p = cols[j - 1];
            const py = mid + dir * p.r * maxAmp * 0.85 * amp(p);
            ctx.quadraticCurveTo(p.x, py, (p.x + c.x) / 2, (py + y) / 2);
          }
        });
        ctx.stroke();
      }

      if (!reduceMotion) requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); if (reduceMotion) draw(0); });
    resize();
    requestAnimationFrame(draw);
