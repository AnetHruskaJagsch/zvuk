<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zvuk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Black with fine forest-green dots, like the rest of the portfolio. */
    :root {
      --bg: #000000;
      --green: #1f3d2b;
      --glow: rgba(31, 61, 43, 0.7);
      --dot: rgba(31, 61, 43, 0.55);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: grid;
      place-items: center;
      background-color: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1.6px);
      background-size: 14px 14px;
      color: var(--green);
      font-family: "IBM Plex Mono", "JetBrains Mono", "Space Mono", ui-monospace, Menlo, monospace;
    }
    a {
      position: relative;
      color: inherit;
      text-decoration: none;
      font-size: clamp(3rem, 14vw, 10rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      text-shadow: 0 0 14px var(--glow);
      transition: letter-spacing 0.6s ease, filter 0.3s ease;
    }
    a:hover, a:focus-visible { letter-spacing: 0.12em; filter: brightness(1.4); }
    a:focus-visible { outline: 2px solid var(--green); outline-offset: 0.2em; }
    /* Blinking terminal cursor just past the word. */
    a i {
      position: absolute;
      left: calc(100% + 0.06em);
      bottom: 0.2em;
      width: 0.45em;
      height: 0.09em;
      background: var(--green);
      box-shadow: 0 0 10px var(--glow);
      animation: blik 1.1s steps(1) infinite;
    }
    @keyframes blik { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
      a i { animation: none; }
    }
  </style>
</head>
<body>
  <a href="vlna.html">zvuk<i aria-hidden="true"></i></a>
</body>
</html>
