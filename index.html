<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zvuk</title>
  <style>
    :root {
      --bg: #f5f3ee;
      --fg: #111111;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0e0e; --fg: #f2f0ea; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    a {
      color: inherit;
      text-decoration: none;
      font-size: clamp(3rem, 14vw, 10rem);
      font-weight: 300;
      letter-spacing: -0.03em;
      transition: letter-spacing 0.6s ease, opacity 0.3s ease;
    }
    a:hover, a:focus-visible { letter-spacing: 0.12em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 0.2em; }
    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
    }
  </style>
</head>
<body>
  <a href="vlna.html">zvuk</a>
</body>
</html>
